name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed by semantic-release to create tags, releases, and release notes.
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release (aarch64-darwin)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: extractions/setup-just@v4

      - uses: hustcer/setup-nu@v3
        with:
          version: "0.114.1"

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@24
          -p @semantic-release/exec@7
          -p @semantic-release/git@10
          semantic-release
